# CI configuration for repositories using `branching_mode = "semantic_commit"`.
#
# Copy this to .gitlab-ci.yml. There is no promote or hotfix job: this mode is
# trunk-based, so versions advance from conventional commit messages instead.
default:
  image: python:3.11

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

before_script:
  - |
    python --version ; pip --version  # For debugging
    pip install -r requirements.txt
    git log --graph --abbrev-commit --oneline --all --decorate

stages:
  - build
  - test
  - tide

# --- standard tide configuration below here ---

.common_rules:
  # provided for convenience: not used by tide
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_REF_PROTECTED == "true"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

.tide-base:
  stage: tide
  before_script:
    - env
    - pip install -e .

# Advisory. `tide validate` always exits non-zero when a rule is broken, with a
# distinct code per rule; `allow_failure` is what decides whether that blocks the
# pipeline. A job that fails under allow_failure is displayed differently from one
# that passes, so this still surfaces the problem. Set allow_failure: false to make
# it blocking, e.g. in a merge train.
validate:
  extends: .tide-base
  allow_failure: true
  script: tide validate --target-branch "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# The authoritative gate: autotag re-runs the same validation on what actually
# landed, and refuses to mint a tag if a rule is broken.
auto-tag:
  extends: .tide-base
  script: tide autotag --annotation "$TIDE_AUTOTAG_ANNOTATION"
  # must be performed serially, in order.
  resource_group: $CI_PROJECT_PATH_SLUG-$CI_COMMIT_BRANCH
  variables:
    TIDE_AUTOTAG_ANNOTATION: $CI_COMMIT_TITLE
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_COMMIT_TAG
      when: never
    # tide init ensures that the trunk is protected
    - if: $CI_COMMIT_REF_PROTECTED == "true"

# --- end standard tide configuration  --

unit-tests:
  extends:
    - .common_rules
  stage: test
  script: echo "Testing!"

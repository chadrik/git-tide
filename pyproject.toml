[project]
name = "git-tide"
version = "0.3.1"
description = "CLI for automated gitflow-style branching"
authors = [
    {name="Chad Dombrova"},
    {name="Matt Collie"},
]
readme = "README.md"
dependencies = [
    "commitizen ==3.16.0",
    "tomli",
    "click",
    "typing-extensions",
]
requires-python = ">=3.8"

[project.urls]
Homepage = "https://github.com/chadrik/git-tide"

[project.optional-dependencies]
init = [
    "python-gitlab ==4.8.0",
]
test = [
    "pytest",
]

[project.scripts]
tide = "tide.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tide"]

[tool.hatch.envs.default]
installer = "uv"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.mypy]
python_version = "3.9"
files = ["noxfile.py", "src"]
ignore_missing_imports = true
show_error_codes = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
markers = [
    "smoke: mark a test as a smoke test",
    "unit: mark a test as a unit test"
]

[tool.tide]
tag_format = "$version"
branches.beta = "develop"
branches.rc = "staging"
branches.stable = "master"

[tool.ruff]
# these defaults are reused in sub-projects via [tool.ruff].extend
show-fixes = true
line-length = 100

[tool.ruff.lint]
select = [
    "B006",  # Do not use mutable data structures for argument defaults
    "B039",  # Do not use mutable data structures for `ContextVar` defaults
    "D",
    "E",
    "F",
    "I",
    "N",
    "PYI",
    "Q",
    "RUF008",  # Do not use mutable default values for dataclass attributes
    "RUF024",  # Do not pass mutable objects as values to dict.fromkeys
    "TID251",  # Banned APIs (configured under `tool.ruff.lint.flake8-tidy-imports.banned-api`)
    "TID252",  # Prefer absolute imports over relative imports from parent modules
    "UP",
    "W",
]

ignore = [
    # "D100",  # Missing docstring in public module
    # "D101",  # Missing docstring in public class
    "D102",  # Missing docstring in public method
    "D103",  # Missing docstring in public function
    "D104",  # Missing docstring in public package
    "D105",  # Missing docstring in magic method
    "D106",  # Missing docstring in public nested class
    "D107",  # Missing docstring in __init__
    "D200",  # One-line docstring should fit on one line
    "D205",  # 1 blank line required between summary line and description
    "D417",  # Missing argument description in the docstring
]

# Some of Ruff's "fixes" are not ideal, so we disable them as needed to avoid confusion.
unfixable = [
    "B006"
]

[tool.ruff.lint.per-file-ignores]
# The expected `git log --graph` fixtures in this module are compared byte-for-byte,
# so their long lines and significant trailing whitespace must be preserved as-is.
"tests/test_scenarios.py" = [
    "E501",  # Line too long
    "W291",  # Trailing whitespace
]

[tool.ruff.lint.pydocstyle]
convention = "google"
